name: Auto‑Update CF DNS (Mobile CMCC IP)
on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 6 * * *'
    - cron: '0 11 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      CF_DNS_NAME: ${{ secrets.CF_DNS_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch CMCC IP & strip #CF suffix
        run: |
          CMCC_IP=$(curl -s --max-time 8 "https://cf.090227.xyz/cmcc?ips=1" || true)
          # 删除 #CF 及后面所有字符，只保留IP
          CMCC_IP=$(echo "$CMCC_IP" | sed 's/#CF.*//' | awk '{print $1}')
          BEST_IP=${CMCC_IP}
          echo "CMCC_IP=${CMCC_IP}" >> $GITHUB_ENV
          echo "Selected CMCC IP: ${BEST_IP}"

      - name: Skip if IP empty
        if: env.BEST_IP == ''
        run: |
          echo "⚠️ IP fetch failed, abort update, keep old DNS."
          exit 0

      - name: Get DNS RecordID
        run: |
          RECORD_ID=$(curl -s --max-time 8 -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${CF_DNS_NAME}" \
          -H "Authorization: Bearer ${CF_API_TOKEN}" | jq -r '.result[0].id')
          echo "RECORD_ID=${RECORD_ID}" >> $GITHUB_ENV
          echo "Got RecordID: ${RECORD_ID}"

      - name: Update CF DNS
        run: |
          curl -s --max-time 8 -X PATCH "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${RECORD_ID}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "type":"A",
              "name":"'${CF_DNS_NAME}'",
              "content":"'${BEST_IP}'",
              "ttl": 300,
              "proxied": false
            }'
