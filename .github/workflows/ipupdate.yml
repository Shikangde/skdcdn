name: Auto‑Update CF DNS (Mobile CMCC IP)
on:
  schedule:
    # 北京时间 10:00 /14:00 /19:00 /00:00
    - cron: '0 2 * * *'
    - cron: '0 6 * * *'
    - cron: '0 11 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu‑24.04
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      CF_DNS_NAME: ${{ secrets.CF_DNS_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 获取三网IP，只选用移动CMCC IP
      - name: Fetch ISP IPs (Only use CMCC)
        run: |
          CT_IP=$(curl -s --connect-timeout 10 "https://cf.090227.xyz/ct?ips=1" | awk '{print $1}')
          CU_IP=$(curl -s --connect-timeout 10 "https://cf.090227.xyz/cu?ips=1" | awk '{print $1}')
          CMCC_IP=$(curl -s --connect-timeout 10 "https://cf.090227.xyz/cmcc?ips=1" | awk '{print $1}')
          BEST_IP=${CMCC_IP}
          echo "CT_IP=${CT_IP}" >> $GITHUB_ENV
          echo "CU_IP=${CU_IP}" >> $GITHUB_ENV
          echo "CMCC_IP=${CMCC_IP}" >> $GITHUB_ENV
          echo "Selected CMCC(Mobile) IP: ${BEST_IP}"

      # IP为空则跳过更新，保留旧IP
      - name: Skip update if IP invalid
        if: env.BEST_IP == ''
        run: |
          echo "⚠️ CMCC IP empty, skip DNS update, keep old record."
          exit 0

      # 自动获取DNS RecordID
      - name: Auto fetch DNS RecordID
        run: |
          RECORD_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${CF_DNS_NAME}" \
          -H "Authorization: Bearer ${CF_API_TOKEN}" | jq -r '.result[0].id')
          echo "RECORD_ID=${RECORD_ID}" >> $GITHUB_ENV
          echo "Auto fetched RecordID: ${RECORD_ID}"

      # 更新CF DNS A记录
      - name: Update Cloudflare DNS Record
        run: |
          curl -X PATCH "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${RECORD_ID}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "type":"A",
              "name":"'${CF_DNS_NAME}'",
              "content":"'${BEST_IP}'",
              "ttl": 300,
              "proxied": false
            }'
