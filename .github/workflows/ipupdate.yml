name: Auto‑Update CF BestIP (Auto‑Get RecordID)
on:
  schedule:
    # UTC时间 = 北京时间 −8小时
    - cron: '0 2 * * *'    # 北京时间 10:00
    - cron: '0 6 * * *'    # 北京时间 14:00
    - cron: '0 11 * * *'   # 北京时间 19:00
    - cron: '0 16 * * *'   # 北京时间 00:00
  workflow_dispatch:        # 支持手动一键运行

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      CF_DNS_NAME: ${{ secrets.CF_DNS_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CloudflareSpeedTest
        run: |
          wget -q https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/CloudflareSpeedTest-linux-amd64.tar.gz
          tar -zxf CloudflareSpeedTest-linux-amd64.tar.gz
          chmod +x ./CloudflareSpeedTest

      - name: SpeedTest pick best IP (sort by download speed)
        run: |
          ./CloudflareSpeedTest -t 25 -n 6 -sort download
          BEST_IP=$(sed -n '2p' result.csv | awk -F ',' '{print $1}')
          echo "BEST_IP=${BEST_IP}" >> $GITHUB_ENV
          echo "Selected Best IP: ${BEST_IP}"

      - name: Skip update if no valid IP found
        if: env.BEST_IP == ''
        run: |
          echo "No valid IP found, skip DNS update, keep old IP."
          exit 0

      - name: Auto fetch DNS RecordID automatically
        run: |
          RECORD_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${CF_DNS_NAME}" \
          -H "Authorization: Bearer ${CF_API_TOKEN}" | jq -r '.result[0].id')
          echo "RECORD_ID=${RECORD_ID}" >> $GITHUB_ENV
          echo "Auto fetched RecordID: ${RECORD_ID}"

      - name: Update Cloudflare DNS A Record
        run: |
          curl -X PATCH "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${RECORD_ID}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "type":"A",
              "name":"'${CF_DNS_NAME}'",
              "content":"'${BEST_IP}'",
              "ttl": 300,
              "proxied": false
            }'
