name: Auto‑Update CT Origin DNS
on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 6 * * *'
    - cron: '0 11 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      CF_DNS_NAME: ct-origin.4219520.xyz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch CT IP & extract pure IPv4
        run: |
          RAW=$(curl -s --max-time 8 "https://cf.090227.xyz/ct?ips=1" || true)
          CT_IP=$(echo "$RAW" | grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}')
          BEST_IP="$CT_IP"
          echo "RAW_DATA: $RAW"
          echo "BEST_IP: $BEST_IP"
          echo "BEST_IP=${BEST_IP}" >> $GITHUB_ENV
      - name: Stop if IP empty
        if: env.BEST_IP == ''
        run: |
          echo "❌ 获取IP为空，退出更新"
          exit 1
      - name: Get DNS Record ID
        run: |
          RECORD_ID=$(curl -s --max-time 8 -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${CF_DNS_NAME}" \
          -H "Authorization: Bearer ${CF_API_TOKEN}" | jq -r '.result[0].id')
          echo "RECORD_ID=${RECORD_ID}" >> $GITHUB_ENV
      - name: Send update request to Cloudflare
        run: |
          RESP=$(curl -s --max-time 8 -X PATCH "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${RECORD_ID}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content‑Type: application/json" \
            -d "{
              \"type\":\"A\",
              \"name\":\"${CF_DNS_NAME}\",
              \"content\":\"${BEST_IP}\",
              \"ttl\": 300,
              \"proxied\": false
            }")
          echo "CF API RESPONSE:"
          echo "$RESP"
